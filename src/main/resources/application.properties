# ============================================================
# application.properties — The settings file for our app.
# ============================================================
# This file tells Spring Boot HOW to behave.
# It's like a configuration control panel.
# Spring Boot reads this file automatically when it starts.
# ============================================================


# ----------------------------------------------------------
# 1. APPLICATION NAME & PORT
# ----------------------------------------------------------
# spring.application.name → A friendly name for our app.
# server.port → The port our web server listens on.
#   After starting, APIs will be at: http://localhost:8080
# ----------------------------------------------------------
spring.application.name=ecommerce-springboot
server.port=8080


# ----------------------------------------------------------
# 2. MYSQL DATABASE CONNECTION
# ----------------------------------------------------------
# url    → Where the database is. Format:
#           jdbc:mysql://HOST:PORT/DATABASE_NAME
#           localhost = your own computer
#           3306      = default MySQL port
#           ecommerce_db = the name of our database
#                          (YOU MUST CREATE THIS DATABASE IN MySQL FIRST!)
#
# username → Your MySQL username (default is "root").
# password → Your MySQL password.
#            ⚠️ CHANGE THIS to your actual MySQL password!
#
# driver-class-name → Tells Java which driver to use for MySQL.
# ----------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ----------------------------------------------------------
# 3. JPA / HIBERNATE SETTINGS
# ----------------------------------------------------------
# Hibernate is the tool (inside JPA) that converts our Java
# classes (entities) into database tables automatically.
#
# ddl-auto = update
#   → Every time the app starts, Hibernate checks our entities
#     and updates the database tables to match. If a table
#     doesn't exist, it creates it. If we add a new column
#     to an entity, it adds the column.
#   → Other options: "create" (drops everything and recreates),
#     "none" (does nothing — used in production).
#
# show-sql = true
#   → Prints every SQL query Hibernate runs to the console.
#     This is very helpful for learning and debugging.
#
# hibernate.format_sql = true
#   → Makes those printed SQL queries easier to read
#     (adds nice formatting with indentation).
#
# database-platform
#   → Tells Hibernate which "dialect" of SQL to use.
#     MySQL 8 uses MySQL8Dialect.
# ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ----------------------------------------------------------
# 4. JWT SETTINGS (ACTIVE — used for authentication)
# ----------------------------------------------------------
# secret → A Base64-encoded secret key used to sign JWT tokens.
#           This MUST be kept secret. Anyone with this key can
#           forge login tokens.
#           ⚠️ In production, use environment variables instead!
#           This is a demo key for learning purposes only.
#
# expiration → How long a token is valid, in milliseconds.
#              86400000 ms = 24 hours.
#              After 24 hours, the user must log in again.
# ----------------------------------------------------------
app.jwt.secret=YOUR_JWT_SECRET_KEY
app.jwt.expiration=86400000

