# ============================================================
# application.properties — The settings file for our app.
# ============================================================
# This file tells Spring Boot HOW to behave.
# It's like a configuration control panel.
# Spring Boot reads this file automatically when it starts.
# ============================================================


# ----------------------------------------------------------
# 1. APPLICATION NAME & PORT
# ----------------------------------------------------------
# spring.application.name → A friendly name for our app.
# server.port → The port our web server listens on.
#   After starting, APIs will be at: http://localhost:8080
# ----------------------------------------------------------
spring.application.name=ecommerce-springboot
server.port=8080


# ----------------------------------------------------------
# 2. MYSQL DATABASE CONNECTION
# ----------------------------------------------------------
# url    → Where the database is. Format:
#           jdbc:mysql://HOST:PORT/DATABASE_NAME
#           localhost = your own computer
#           3306      = default MySQL port
#           ecommerce_db = the name of our database
#                          (YOU MUST CREATE THIS DATABASE IN MySQL FIRST!)
#
# username → Your MySQL username (default is "root").
# password → Your MySQL password.
#            ⚠️ CHANGE THIS to your actual MySQL password!
#
# driver-class-name → Tells Java which driver to use for MySQL.
# ----------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ----------------------------------------------------------
# 3. JPA / HIBERNATE SETTINGS
# ----------------------------------------------------------
# Hibernate is the tool (inside JPA) that converts our Java
# classes (entities) into database tables automatically.
#
# ddl-auto = update
#   → Every time the app starts, Hibernate checks our entities
#     and updates the database tables to match. If a table
#     doesn't exist, it creates it. If we add a new column
#     to an entity, it adds the column.
#   → Other options: "create" (drops everything and recreates),
#     "none" (does nothing — used in production).
#
# show-sql = true
#   → Prints every SQL query Hibernate runs to the console.
#     This is very helpful for learning and debugging.
#
# hibernate.format_sql = true
#   → Makes those printed SQL queries easier to read
#     (adds nice formatting with indentation).
#
# database-platform
#   → Tells Hibernate which "dialect" of SQL to use.
#     MySQL 8 uses MySQL8Dialect.
# ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ----------------------------------------------------------
# 4. JWT SETTINGS (ACTIVE — used for authentication)
# ----------------------------------------------------------
# secret → A Base64-encoded secret key used to sign JWT tokens.
#           This MUST be kept secret. Anyone with this key can
#           forge login tokens.
#           ⚠️ In production, use environment variables instead!
#           This is a demo key for learning purposes only.
#
# expiration → How long a token is valid, in milliseconds.
#              86400000 ms = 24 hours.
#              After 24 hours, the user must log in again.
# ----------------------------------------------------------
app.jwt.secret=YOUR_JWT_SECRET_KEY
app.jwt.expiration=86400000


# ----------------------------------------------------------
# 5. REDIS CACHE SETTINGS
# ----------------------------------------------------------
# Redis is an in-memory data store that we use as a CACHE.
# A cache is like a sticky-note board: instead of going to
# the full database every time, we first check the board.
# If the answer is already there (cache HIT), we return it
# instantly. If not (cache MISS), we go to the database,
# get the answer, and also stick a note on the board for
# next time.
#
# host → Where Redis is running.
#         localhost = on your own computer.
# port → Default Redis port is 6379.
#
# cache.redis.time-to-live → How long (in milliseconds) a
#   cached value stays valid before it expires automatically.
#   600000 ms = 10 minutes.
#   After 10 minutes, the next request will go to MySQL
#   to get fresh data and then re-cache it.
# ----------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=600000


# ----------------------------------------------------------
# 6. RABBITMQ SETTINGS
# ----------------------------------------------------------
# RabbitMQ is a message broker. Think of it as a post office.
# When an order is placed, instead of doing all the work
# immediately, our app drops a "letter" (message) into a
# "mailbox" (queue) at RabbitMQ. A background worker
# (consumer) picks up that letter and processes the order.
#
# host → Where RabbitMQ is running (on your computer).
# port → Default RabbitMQ AMQP port is 5672.
# username/password → Default RabbitMQ credentials.
#
# order.exchange → The name of our exchange.
#   An exchange is the "sorting office" that decides which
#   queue a message should go to based on the routing key.
#
# order.queue → The name of our queue (the "mailbox").
#   Our consumer listens to this queue for new order events.
#
# order.routing-key → The label on the "letter".
#   The exchange uses this label to route the message to
#   the correct queue.
# ----------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

order.exchange=order.exchange
order.queue=order.queue
order.routing-key=order.created
